<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 👧DiAriEs - 女孩ㄉ凹兜日誌 </title>
    <style>
        :root {
            --primary-color: #2d5a27;
            --bg-color: #f4f7f1;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 { color: var(--primary-color); }
        
        .search-container {
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        #searchInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            outline: none;
            box-sizing: border-box;
        }

        .article-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .article-card:hover {
            transform: translateY(-5px);
        }

        /* 補上圖片樣式 */
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 20px;
        }

        .article-tag {
            background: #e8f5e9;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .article-title {
            display: block;
            font-size: 1.4em;
            font-weight: bold;
            margin: 10px 0;
            color: #222;
            text-decoration: none;
        }
        .article-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        .read-more {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
        }
        .no-results {
            text-align: center;
            color: #999;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1> 👧DiAriEs - 愛運動女孩ㄉ凹兜日誌 </h1>
        <p><strong>Recording My Dopamine Moments</strong></p>
        <p> 
            喜歡跑河濱 >>> 跑操場 >>> 跑跑步機 <br/>
            佛系完百、愜意走，希望能享受山頭不同時期的美<br/>
            山、海都喜歡，目前還是山系的女子<br/>
            希望每年能安排一次出國 (●'◡'●)<br/>
            半馬 PB：2:00:54 ｜ 百岳進度：39% ｜ AOW
        </p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜尋山名、難度或地點...">
    </div>

    <div id="articleList"></div>
</div>

<script>
    const hikingData = [
        {
            title: "雪山東峰單攻",
            date: "2025/11/23",
            difficulty: "難易程度：⭐",
            content: "推薦給剛入山坑的新新手", // 修正冒號與引號
            img: "images/IMG_7267.JPG", // 補上圖片路徑
            link: "articles/trip1.html"
        },
        {
            title: "NO.37-38 雪山主東峰",
            date: "2025/08/16-08/17",
            difficulty: "進階A+B",
            img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800",
            link: "https://www.google.com"
        }
    ];

    const searchInput = document.getElementById('searchInput');
    const articleList = document.getElementById('articleList');

    function renderArticles(data) {
        articleList.innerHTML = '';
        
        if (data.length === 0) {
            articleList.innerHTML = '<div class="no-results">找不到相關行程</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <img src="${item.img}" class="card-img" alt="${item.title}">
                <div class="card-body">
                    <span class="article-tag">${item.difficulty}</span>
                    <a href="${item.link}" class="article-title">${item.title}</a>
                    <div class="article-info">📅 ${item.date}</div>
                    <a href="${item.link}" target="_blank" class="read-more">閱讀全文 →</a>
                </div>
            `;
            articleList.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filteredData = hikingData.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.difficulty.toLowerCase().includes(keyword)
        );
        renderArticles(filteredData);
    });

    renderArticles(hikingData);
</script>

</body>
</html>
