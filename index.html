<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 👧DiAriEs - 女孩ㄉ凹兜日誌 </title>
    <style>
        :root {
            --primary-color: #2d5a27;
            --bg-color: #f4f7f1;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 { color: var(--primary-color); }
        
        /* 搜尋框樣式 */
        .search-container {
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        #searchInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            outline: none;
        }

        /* 文章卡片樣式 */
        .article-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .article-card:hover {
            transform: translateY(-5px);
        }
        .article-tag {
            background: #e8f5e9;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .article-title {
            margin: 10px 0;
            color: #222;
        }
        .article-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        .no-results {
            text-align: center;
            color: #999;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1> 👧DiAriEs - 女孩ㄉ凹兜日誌 </h1>
        <p><strong> Recording My Dopamine Moments </p></strong></br>
        <p> 喜歡跑河濱>>>跑操場>>>>>>>>>跑跑步機 <br/>
            佛系完百、愜意走，希望能享受山頭不同時期的美</br>
            山、海都喜歡，目前還是山系的女子</br>
            希望每年能安排一次出國(●'◡'●)</br>
            半馬PB：2:00:54｜百岳進度：39%｜AOW
        </p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜尋山名、難度或地點... (例如：玉山, 初級)">
    </div>

    <div id="articleList">
        </div>
</div>

<script>
    // 這裡存放你的資料
    // img: 圖片網址 (可用 Unsplash 或 Imgur)
    // link: 外部文章網址 (IG、部落格等)
    const hikingData = [
        {
            title: "雪山東峰單攻",
            date: "2025/11/23",
            difficulty: "難易程度：⭐",
            content："推薦給剛入山坑的新新手",
            link: "articles/trip1.html" // 換成你的文章網址
        },
        {
            title: "NO.37-38 雪山主東峰",
            date: "2025/08/16-08/17",
            difficulty: "進階A+B",
            img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800",
            link: "https://www.google.com" // 換成你的文章網址
        }
    ];

    const searchInput = document.getElementById('searchInput');
    const articleList = document.getElementById('articleList');

    function renderArticles(data) {
        articleList.innerHTML = '';
        
        if (data.length === 0) {
            articleList.innerHTML = '<div class="no-results">找不到相關行程</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <img src="${item.img}" class="card-img" alt="${item.title}">
                <div class="card-body">
                    <span class="article-tag">${item.difficulty}</span>
                    <a href="${item.link}" target="_blank" class="article-title">${item.title}</a>
                    <div class="article-info">📅 ${item.date}</div>
                    <a href="${item.link}" target="_blank" class="read-more">閱讀全文</a>
                </div>
            `;
            articleList.appendChild(card);
        });
    }

    // 搜尋邏輯
    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filteredData = hikingData.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.difficulty.toLowerCase().includes(keyword)
        );
        renderArticles(filteredData);
    });

    // 初始載入
    renderArticles(hikingData);
</script>

</body>
</html>
