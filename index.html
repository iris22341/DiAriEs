<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 👧DiAriEs - 愛運動女孩ㄉ凹兜日誌 </title>
    <style>
        :root {
            --primary-color: #2d5a27;
            --bg-color: #f4f7f1;
            --text-color: #333;
            --secondary-text: #666;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .header-bio { margin-top: 15px; font-size: 0.95em; }
        
        /* 搜尋框美化 */
        .search-container {
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        #searchInput {
            width: 100%;
            padding: 15px 25px;
            font-size: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(45, 90, 39, 0.15);
            outline: none;
            box-sizing: border-box;
            background: white;
        }

        /* 卡片設計升級 */
        .article-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .article-card:hover {
            transform: translateY(-8px);
        }

        /* 圖片自適應調整：完整顯示但限制最大高度 */
        .card-img-container {
            background: #eee;
            text-align: center;
        }
        .card-img {
            width: 100%;
            max-height: 450px; /* 限制高度，避免照片太長佔滿螢幕 */
            object-fit: contain; /* 確保完整顯示，不裁切 */
            display: block;
        }

        .card-body {
            padding: 25px;
        }

        .article-tag {
            background: #e8f5e9;
            color: var(--primary-color);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }
        .article-title {
            display: block;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
            text-decoration: none;
        }
        .article-content {
            font-size: 1em;
            color: var(--text-color);
            margin-bottom: 15px;
            border-left: 3px solid #e8f5e9;
            padding-left: 10px;
        }
        .article-info {
            font-size: 0.85em;
            color: var(--secondary-text);
            margin-bottom: 20px;
        }
        
        /* 閱讀全文按鈕化 */
        .read-more {
            display: inline-block;
            padding: 8px 20px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }
        .read-more:hover {
            opacity: 0.85;
            color: white;
        }

        .no-results {
            text-align: center;
            color: #999;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1> 👧 DiAriEs - 愛運動女孩ㄉ凹兜日誌 </h1>
        <p><strong>✨ Recording My Dopamine Moments ✨</strong></p>
        <div class="header-bio"> 
            喜歡跑河濱 > 跑操場 >>> 跑跑步機 <br/>
            佛系完百，享受山頭不同時期的美<br/>
            山、海都喜歡，目前還是山系的女子<br/>
            每年安排一次出國 (●'◡'●)<br/>
            半馬 PB：2:00:54 ｜ 百岳進度：39% ｜ AOW
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜尋山名、難度或地點...">
    </div>

    <div id="articleList"></div>
</div>

<script>
    const hikingData = [
        {
            title: "雪山東峰單攻",
            date: "2025/11/23",
            difficulty: "難易程度：⭐",
            content: "推薦給剛入山坑的新新手，展望極佳！",
            img: "images/IMG_7267.JPG", 
            link: "articles/trip1.html"
        },
        {
            title: "NO.37-38 雪山主東峰",
            date: "2025/08/16-08/17",
            difficulty: "進階A+B",
            content: "兩天一夜的經典行程，雖然累但聖稜線無敵。",
            img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800",
            link: "https://www.google.com"
        }
    ];

    const searchInput = document.getElementById('searchInput');
    const articleList = document.getElementById('articleList');

    function renderArticles(data) {
        articleList.innerHTML = '';
        
        if (data.length === 0) {
            articleList.innerHTML = '<div class="no-results">找不到相關行程</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <div class="card-img-container">
                    <img src="${item.img}" class="card-img" alt="${item.title}">
                </div>
                <div class="card-body">
                    <span class="article-tag">${item.difficulty}</span>
                    <a href="${item.link}" target="_blank" class="article-title">${item.title}</a>
                    <p class="article-content">${item.content || ""}</p> 
                    <div class="article-info">📅 ${item.date}</div>
                    <a href="${item.link}" target="_blank" class="read-more">閱讀全文 →</a>
                </div>
            `;
            articleList.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filteredData = hikingData.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.difficulty.toLowerCase().includes(keyword)
        );
        renderArticles(filteredData);
    });

    renderArticles(hikingData);
</script>

</body>
</html>
